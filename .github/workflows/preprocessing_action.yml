name: Automated Data Preprocessing

on:
  push:
    paths:
      - 'healthy_diet_calorie_intake.csv'
      - 'preprocessing/automate_Tegas-Gagas-Impian.py'
  workflow_dispatch: # Mengizinkan trigger manual dari tab Actions GitHub

jobs:
  preprocess_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib untuk melakukan push (mengembalikan data)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run Preprocessing Script
        run: python preprocessing/automate_Tegas-Gagas-Impian.py

      - name: Commit and Push Processed Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add preprocessing/healthy_diet_calorie_intake_preprocessing.csv
          
          # Hanya commit jika ada perubahan pada healthy_diet_calorie_intake_preprocessing.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update processed dataset via GitHub Actions"
          git push